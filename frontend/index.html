<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberMonitor &mdash; Phishing Awareness Platform</title>
    <meta name="description" content="Cybersecurity phishing awareness simulation platform for organisations." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set platform-appropriate title BEFORE React loads so the admin
      // dashboard title never flashes in the browser tab for simulation links.
      (function() {
        var p = window.location.pathname.toLowerCase();
        if (p.indexOf('/simulate') === 0) {
          if (p.indexOf('tiktok') !== -1)          document.title = 'Log in | TikTok';
          else if (p.indexOf('snapchat') !== -1)   document.title = 'Log In \u2022 Snapchat';
          else if (p.indexOf('facebook') !== -1)    document.title = 'Facebook \u2013 log in or sign up';
          else                                       document.title = 'Log in';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
